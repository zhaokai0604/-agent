# 开发阶段：登录即可查看「执行审计」列表（无需管理员角色）
# 数据库建表请手动执行 src/main/resources/schema.sql（spring.sql.init 已在 application.yml 设为 never）
app:
  security:
    ai-audit-relaxed-read: true

# 本地 Windows / 无 sudo 用户时可改为 false，避免 sudo -u 失败
agent:
  min-privilege:
    enabled: false

logging:
  level:
    com.award.log.mapper: debug
