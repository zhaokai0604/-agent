spring:
  main:
    lazy-initialization: true
  sql:
    init:
      # 本地库已手动初始化时关闭自动跑 schema.sql，避免重复建表导致启动失败
      mode: never
  # 数据库密码：勿在此覆盖；由 application.yml import 的 application-local.yml 或环境变量 DB_PASSWORD 提供

# 开发阶段：登录即可查看「执行审计」列表（无需管理员角色）
app:
  security:
    ai-audit-relaxed-read: true
  # 单端口 dev：登录/MCP/Agent 与业务 API 均走 8088（与 prod-kylin 一致）
  management:
    enabled: false

# Windows 本地：巡检扫描用户目录与项目 logs，避免默认 /var/log 空跑
ops:
  dry-run:
    global: false
  auto-remediation:
    enabled: false
  patrol:
    inspect-roots: ${OPS_PATROL_INSPECT_ROOTS:logs,C:/Users/Administrator/AppData/Local/Temp,C:/Windows/Temp}

# 本地 Windows / 无 sudo 用户时可改为 false，避免 sudo -u 失败
agent:
  min-privilege:
    enabled: false

knowledge:
  seed-on-startup: false

logging:
  level:
    com.award.log: DEBUG
