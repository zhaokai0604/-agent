# 本地敏感配置示例（可复制为 application-local.yml）
#
# cp src/main/resources/application-local.example.yml src/main/resources/application-local.yml
# application-local.yml 已在 .gitignore 中，勿提交仓库。
#
# 与主配置合并后，可覆盖数据库密码、大模型 Key、邮件等（优先级高于环境变量中的空值场景）。

spring:
  datasource:
    # 本地 MySQL 密码（生产请用环境变量 DB_PASSWORD，勿写在此文件并入库）
    password: "请填写本地 MySQL 密码"

  ai:
    openai:
      # DashScope / OpenAI 兼容密钥（生产请用 AI_API_KEY）
      api-key: "请填写 API Key"

  mail:
    username: "你的QQ号@qq.com"
    password: "QQ邮箱生成的16位SMTP授权码"

# 告警等系统发信失败时，看后端控制台 WARN 堆栈；常见原因：
# - 密码必须是「SMTP 授权码」，不是 QQ 登录密码
# - username 与发件人一致，形如 xxx@qq.com
# - QQ 邮箱网页端已开启 SMTP
# - 使用 587 且需 STARTTLS 时增加（465 一般不要开）：
#   MAIL_STARTTLS_ENABLE=true
