# 本机覆盖配置（复制为 application-local.yml，已在 .gitignore）
#
# Windows: copy src\main\resources\application-local.example.yml src\main\resources\application-local.yml
# Linux/macOS: cp src/main/resources/application-local.example.yml src/main/resources/application-local.yml
#
# 与主配置合并后，可覆盖数据库密码、大模型 Key、SSH 凭证加密密钥等。

spring:
  profiles:
    active: dev
  datasource:
    # 默认 MariaDB 10.11（与 application.yml 一致）
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/log_analysis?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "请填写本地 MariaDB 密码"

  ai:
    openai:
      api-key: "请填写 API Key"
      # base-url: https://api.deepseek.com
      # chat.options.model: deepseek-chat

  mail:
    username: "请填写发件邮箱"
    password: "请填写邮箱授权码"

# SSH 主机凭证 AES 加密（远程运维必需，勿提交真实值到 Git）
# 也可在系统环境变量中设置：APP_CONFIG_SECRET=your-long-random-secret
APP_CONFIG_SECRET: "请填写至少16字符的随机密钥"
