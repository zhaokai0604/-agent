# 本机覆盖配置（复制为 application-local.yml，已在 .gitignore）
#
# cp src/main/resources/application-local.example.yml src/main/resources/application-local.yml
#
# 说明：
# - 麒麟虚拟机测试：默认 profile 已是 test-kylin，密钥见 application-test-kylin.yml，一般不用改本文件
# - Windows 本地开发：默认 MySQL，填写本机 root 密码与 API Key
# - 麒麟迁移：spring.profiles.active=test-kylin 或 prod-kylin（MariaDB，见 application-test-kylin.yml）

spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/log_analysis?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "请填写本机 MySQL 密码"
  ai:
    openai:
      api-key: "请填写 API Key"
      base-url: https://dashscope.aliyuncs.com/compatible-mode

agent:
  min-privilege:
    enabled: false

# Qdrant Cloud 知识库（复制到 application-local.yml 后填写，勿提交）
qdrant:
  url: "https://你的集群.region.gcp.cloud.qdrant.io"
  api-key: "你的 Qdrant API Key"
  collection: ops_knowledge
