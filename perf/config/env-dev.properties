# ThreshCore performance test environment configuration
# Copy this file per environment if needed and keep real secrets out of git.

# Base URLs
protocol=http
host=127.0.0.1
business.port=8088
management.port=8088
context.path=/award-log
business.base=${__P(protocol)}://${__P(host)}:${__P(business.port)}${__P(context.path)}
management.base=${__P(protocol)}://${__P(host)}:${__P(management.port)}${__P(context.path)}
allowed.origin=${__P(protocol)}://${__P(host)}:5173

# Credentials
login.username=test
login.password=test

# Timing defaults
connect.timeout.ms=10000
response.timeout.ms=600000
poll.interval.ms=3000
task.complete.timeout.ms=900000
sse.timeout.ms=300000
ws.duration.sec=900

# Upload files
log.file.small=perf/data/logs/log-small-mixed-1mb.log
log.file.medium=perf/data/logs/log-medium-anomaly-10mb.log
log.file.large=perf/data/logs/log-large-dirty-50mb.log
log.file.extra1=perf/data/logs/log-small-normal-1mb.log
log.file.extra2=perf/data/logs/log-small-anomaly-1mb.log

# Query defaults
page.num=1
page.size=10
alarm.days=7
perf.data.type=cpu
perf.interval=5
knowledge.query=database connection timeout root cause
knowledge.topk=5
ops.limit=20

# Load profile defaults
baseline.users=10
mixed.users=30
ai.stream.users=10
ws.connections=100
ramp.up.sec=30
loop.count=1
duration.sec=1800

# AI controls
assistant.useToolAgent=true
assistant.confirmRemediation=false
simulate.ai=false

# Result directories
result.root=perf/data/results
jmeter.result.dir=perf/data/results/jmeter
k6.result.dir=perf/data/results/k6

# Optional manual inputs
task.id=
start.time=2026-06-20T00:00:00
end.time=2026-06-25T23:59:59
