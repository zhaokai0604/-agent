# 本地/演示用依赖栈（应用进程仍建议本机 mvn / jar 启动，便于调试 MCP 与宿主路径）
#
# 启动：docker compose up -d mariadb qdrant
# 建表：首次需对库执行 src/main/resources/schema.sql（及所需增量 SQL）
#
# 环境变量可复制根目录 .env.example

services:
  mariadb:
    image: mariadb:10.11
    container_name: threshcore-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?请在 .env 中设置 MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-log_analysis}
      TZ: Asia/Shanghai
    ports:
      - "${MARIADB_PUBLISH_PORT:-3306}:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 8s
      timeout: 5s
      retries: 12
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: threshcore-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PUBLISH_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  qdrant_storage:
